[project]
name = "langgraph-guide-samples"
version = "1.0.0"
description = "Runnable samples for the LangGraph 1.2.20 guide"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.20",
  "langchain-deepseek==1.1.1",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
